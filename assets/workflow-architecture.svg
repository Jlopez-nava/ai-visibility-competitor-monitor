<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">AI Visibility Competitor Monitor workflow architecture</title>
  <desc id="desc">A public-safe architecture diagram showing Profound visibility data flowing through classification and evidence analysis into weekly reporting, surpass briefs, and closing-gap recommendations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081525"/>
      <stop offset="1" stop-color="#102b3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#7dd3fc"/>
    </marker>
    <style>
      .eyebrow { font: 700 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 3px; fill: #5eead4; }
      .headline { font: 750 42px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .subhead { font: 400 20px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #a8c3d6; }
      .label { font: 700 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .copy { font: 400 15px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #a8c3d6; }
      .pill { font: 700 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>
  <circle cx="1245" cy="76" r="230" fill="#0ea5e9" opacity="0.07"/>
  <circle cx="112" cy="710" r="260" fill="#14b8a6" opacity="0.06"/>

  <text x="72" y="82" class="eyebrow">AI VISIBILITY INTELLIGENCE</text>
  <text x="72" y="137" class="headline">From competitive movement to content action</text>
  <text x="72" y="176" class="subhead">A weekly evidence pipeline built in Profound</text>

  <g filter="url(#shadow)">
    <rect x="72" y="242" width="220" height="156" rx="20" fill="#102a3a" stroke="#265168"/>
    <rect x="92" y="262" width="62" height="27" rx="13" fill="#164e63"/>
    <text x="123" y="281" text-anchor="middle" class="pill" fill="#67e8f9">INPUT</text>
    <text x="92" y="326" class="label">Topic selector</text>
    <text x="92" y="357" class="copy">One topic or a</text>
    <text x="92" y="379" class="copy">complete weekly sweep</text>

    <rect x="340" y="242" width="238" height="156" rx="20" fill="#102a3a" stroke="#265168"/>
    <rect x="360" y="262" width="92" height="27" rx="13" fill="#164e63"/>
    <text x="406" y="281" text-anchor="middle" class="pill" fill="#67e8f9">MEASURE</text>
    <text x="360" y="326" class="label">Profound signals</text>
    <text x="360" y="357" class="copy">Visibility scores and</text>
    <text x="360" y="379" class="copy">citation pages by topic</text>

    <rect x="626" y="242" width="238" height="156" rx="20" fill="#102a3a" stroke="#3a6072"/>
    <rect x="646" y="262" width="88" height="27" rx="13" fill="#134e4a"/>
    <text x="690" y="281" text-anchor="middle" class="pill" fill="#5eead4">DECIDE</text>
    <text x="646" y="326" class="label">Classify movement</text>
    <text x="646" y="357" class="copy">Nearest competitor and</text>
    <text x="646" y="379" class="copy">fastest weekly closer</text>

    <rect x="912" y="242" width="416" height="156" rx="20" fill="#102a3a" stroke="#3a6072"/>
    <rect x="932" y="262" width="92" height="27" rx="13" fill="#134e4a"/>
    <text x="978" y="281" text-anchor="middle" class="pill" fill="#5eead4">EXPLAIN</text>
    <text x="932" y="326" class="label">Grounded competitive narrative</text>
    <text x="932" y="357" class="copy">Separate brand decline from competitor growth,</text>
    <text x="932" y="379" class="copy">then connect the shift to citation-earning content.</text>
  </g>

  <path d="M292 320 H330" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M578 320 H616" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M864 320 H902" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>

  <path d="M745 398 V468" stroke="#7dd3fc" stroke-width="3"/>
  <path d="M296 468 H1150" stroke="#7dd3fc" stroke-width="3"/>
  <path d="M296 468 V492" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M745 468 V492" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1150 468 V492" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="122" y="504" width="348" height="164" rx="20" fill="#18273a" stroke="#fb7185"/>
    <rect x="144" y="526" width="92" height="28" rx="14" fill="#4c1d2d"/>
    <text x="190" y="545" text-anchor="middle" class="pill" fill="#fda4af">SURPASS</text>
    <text x="144" y="590" class="label">Full response brief</text>
    <text x="144" y="621" class="copy">Scrape up to three pages, create a</text>
    <text x="144" y="643" class="copy">content plan, save to Docs, alert Slack.</text>

    <rect x="522" y="504" width="446" height="164" rx="20" fill="#18273a" stroke="#fbbf24"/>
    <rect x="544" y="526" width="92" height="28" rx="14" fill="#4a3812"/>
    <text x="590" y="545" text-anchor="middle" class="pill" fill="#fde68a">CLOSING</text>
    <text x="544" y="590" class="label">Early-warning recommendation</text>
    <text x="544" y="621" class="copy">Explain the closure rate, identify the coverage gap,</text>
    <text x="544" y="643" class="copy">and prioritize preventive content action.</text>

    <rect x="1020" y="504" width="260" height="164" rx="20" fill="#18273a" stroke="#34d399"/>
    <rect x="1042" y="526" width="78" height="28" rx="14" fill="#103b32"/>
    <text x="1081" y="545" text-anchor="middle" class="pill" fill="#6ee7b7">STABLE</text>
    <text x="1042" y="590" class="label">Document the moat</text>
    <text x="1042" y="621" class="copy">Retain the signal in the</text>
    <text x="1042" y="643" class="copy">weekly competitive report.</text>
  </g>

  <rect x="72" y="706" width="1256" height="2" fill="url(#accent)" opacity="0.8"/>
  <text x="72" y="736" class="copy">Profound · Python · Firecrawl · Anthropic · Google Docs · Slack</text>
</svg>
